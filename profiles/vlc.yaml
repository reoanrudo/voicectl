# VLC media player（vlc.exe）用プロファイル
# 動画・音声の再生を音声で操作する。VLC のショートカットをそのまま使う
name: VLC

match:
  exe: [vlc]

vocabulary:
  - 字幕
  - スナップショット
  - ループ再生

commands:
  再生と一時停止:
    say: [再生して, 一時停止, 止めて, 再開して, ポーズ]
    do:
      - keys: "Space"
  早送り:
    say: [早送り, 進めて, 先に進んで]
    do:
      - keys: "Right"
  巻き戻し:
    say: [巻き戻し, 戻して, 少し戻って]
    do:
      - keys: "Left"
  大きく進める:
    say: [大きく進めて, 1分進めて]
    do:
      - keys: "Ctrl+Right"
  大きく戻す:
    say: [大きく戻して, 1分戻して]
    do:
      - keys: "Ctrl+Left"
  全画面:
    say: [全画面, フルスクリーン]
    do:
      - keys: "f"
  音量を上げて:
    say: [音量上げて, 音を大きく]
    do:
      - keys: "Ctrl+Up"
  音量を下げて:
    say: [音量下げて, 音を小さく]
    do:
      - keys: "Ctrl+Down"
  消音:
    say: [ミュート, 消音, 音を消して]
    do:
      - keys: "m"
  次のチャプター:
    say: [次のチャプター, 次の部分, 次に行って]
    do:
      - keys: "n"
  前のチャプター:
    say: [前のチャプター, 前の部分, 前に戻って]
    do:
      - keys: "p"
  字幕を切り替え:
    say: [字幕, 字幕つけて, 字幕消して]
    do:
      - keys: "v"
  ループ再生:
    say: [ループ再生, 繰り返し再生, リピート]
    do:
      - keys: "l"
  再生速度を上げて:
    say: [再生速度を上げて, 速くして, 倍速にして]
    do:
      - keys: "plus"
  再生速度を下げて:
    say: [再生速度を下げて, 遅くして, スローにして]
    do:
      - keys: "minus"
  等速に戻して:
    say: [等速に戻して, 速度を戻して, 通常の速さ]
    do:
      - keys: "="
