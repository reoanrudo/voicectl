# Zoom（Zoom.exe）用プロファイル
# 会議中のマイク・カメラを音声で操作する（Zoom 既定のショートカット）
name: Zoom

match:
  exe: [zoom]

vocabulary:
  - ミュート
  - ブレイクアウト

commands:
  ミュートの切り替え:
    say: [ミュート, 消音, ミュート解除, マイク切って, マイクつけて]
    do:
      - keys: "Alt+a"
  カメラの切り替え:
    say: [カメラ切って, カメラつけて, カメラ, ビデオ切って]
    do:
      - keys: "Alt+v"
  手を挙げる:
    say: [手を挙げて, 手を下ろして, 挙手]
    do:
      - keys: "Alt+y"
  画面共有の開始と停止:
    say: [画面共有, 共有して, 共有やめて]
    do:
      - keys: "Alt+s"
  チャットを開く:
    say: [チャット, チャット開いて]
    do:
      - keys: "Alt+h"
