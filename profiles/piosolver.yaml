# PioSolver（画面は PioViewer3）用プロファイル（PioViewer が前面にあるときだけ有効）
name: PioSolver PioViewer3

match:
  exe: [pioviewer, piosolver]   # 実行ファイル名の一部（PioViewer3.exe など）
  title: [PioViewer, PioSOLVER]  # ウィンドウタイトルの一部

# スタートメニューに登録されていないので、起動パスを書く（PioSOLVER3-pro.exe は計算エンジンで、画面は PioViewer）
launch: C:\PioSOLVER\PioViewer3.exe

# アプリ名の読み（どのアプリが前面でも有効。「ピオソルバー開いて」で起動）
readings: [ピオソルバー, ピオソルバ, ピオビューワー, ピオビューアー, ピオビュワー, ピオ]

# PioSolver が前面のときだけ使う読み替え
dictionary:
  インポジション: IP
  アウトオブポジション: OOP
  ジーティーオー: GTO
  イーブイ: EV
  オーオーピー: OOP
  アイピー: IP
  ビービー: BB
  エスビー: SB
  ビーティーエヌ: BTN
  ユーティージー: UTG
  シーオー: CO
  エイチジェイ: HJ
  シービー: CB
  シーベット: Cベット

# PioSolver が前面のときだけ足す、音声認識のヒント（ポーカー用語）
vocabulary:
  - PioSolver
  - フロップ
  - ターン
  - リバー
  - プリフロップ
  - ボード
  - レンジ
  - ハンド
  - ベット
  - チェック
  - コール
  - レイズ
  - フォールド
  - オールイン
  - ドンクベット
  - ポット
  - スタック
  - エクイティ
  - EV
  - GTO
  - ノードロック
  - ツリー
  - ソルブ
  - ストラテジー
  - IP
  - OOP
  - ハンドマトリクス

# 独自コマンド（言い方 → 手順）。PioSolver のメニューを「このアプリを覚えて」で読み取れば、
# メニューにある操作はここに書かなくても声で実行できる。メニューにない操作や、複数手順の操作をここに書く。
#
# 手順に書けるもの：
#   - keys: "Ctrl+B"          キー操作（F5, Alt+Enter, Ctrl+Shift+S など）
#   - menu: [Tree, Build tree]  メニューを順にたどって実行
#   - click: "Solve"          画面上のボタンなどを名前でクリック
#   - text: "AsKd7h"          文字を入力
#   - wait: 0.5               秒数だけ待つ
# confirm: true を付けると、実行前に必ず確認する
commands: {}
#  ソルブ開始:
#    say: [ソルブして, 計算開始, 解いて]
#    do:
#      - click: "Go"
#  ボード入力:
#    say: [ボードを入力]
#    do:
#      - click: "Board"
#      - wait: 0.3

# メニュー項目の日本語の言い方（PioViewer のメニューは英語のため）。キーは「このアプリを覚えて」で記録した
# メニューのパス（cache/appmaps/pioviewer3.exe.json の path を " > " でつないだもの）と完全に一致させる。
# 言い方と完全に一致すれば即実行、近い言い方なら Jev がこれを手がかりに選ぶ。
menu_aliases:
  "File > Load tree": [ツリーを読み込んで, ツリーを開いて, ツリー読み込み, ファイルを開いて]
  "File > Save full tree": [ツリーを保存, フルツリーを保存, フルで保存]
  "File > Save small tree(without rivers, recommended)": [小さいツリーで保存, スモールツリーで保存, リバーなしで保存]
  "File > Save very small tree(only flops cached)": [最小のツリーで保存, フロップだけ保存]
  "File > Load other tree in the same folder": [同じフォルダの別のツリー, 別のツリーを開いて, 次のツリー]
  "File > Open directory with current save": [保存フォルダを開いて, 保存先を開いて]
  "File > Open current tree in another PioViewer": [別のPioViewerで開いて]
  "Solver > Connect": [ソルバーに接続, ソルバー接続, 接続して, ソルバーにつないで]
  "Solver > Disconnect": [ソルバーを切断, 切断して]
  "Solver > Reconnect": [ソルバーに再接続, 再接続]
  "Solver > Benchmark": [ベンチマーク]
  "Tools > Select Range": [レンジを選択, レンジ選択, レンジを選んで]
  "Tools > Configuration": [設定を開いて, コンフィグ]
  "Tools > Keyboard Shortcuts Configuration": [ショートカットの設定, キーボードショートカット]
  "Tools > Paste tree building config from clipboard": [ツリー設定を貼り付け]
  "Tools > Show > Clone current view in new window": [別ウィンドウで表示, ビューを複製]
  "Tools > Show > Range OOP": [OOPのレンジ, OOPレンジ, OOPのレンジを表示]
  "Tools > Show > Range IP": [IPのレンジ, IPレンジ, IPのレンジを表示]
  "Tools > Show > Equity OOP": [OOPのエクイティ, OOPエクイティ]
  "Tools > Show > Equity IP": [IPのエクイティ, IPエクイティ]
  "Tools > Show > EV OOP": [OOPのEV, OOPのEVを見せて, OOPのEVを表示]
  "Tools > Show > EV IP": [IPのEV, IPのEVを見せて, IPのEVを表示]
  "Tools > Show > Strategy": [戦略を表示, 戦略, ストラテジー, ストラテジーを表示]
  "Tools > Show > Strategy + EV": [戦略とEV, ストラテジーとEV]
  "Tools > Show > Strategy + Reaction": [戦略とリアクション]
  "Tools > Show > Show Regrets": [リグレットを表示, リグレット]
  "Tools > Show > MES": [MESを表示]
  "Tools > Show > Blockers > Blockers OOP": [OOPのブロッカー]
  "Tools > Show > Blockers > Blockers IP": [IPのブロッカー]
  "Tools > Show > Blockers > Blockers Current Player": [今のプレイヤーのブロッカー, ブロッカー]
  "Tools > Show > Blockers > Blockers Other Player": [相手のブロッカー]
  "Tools > Show > Toggle one / two grids": [グリッドを切り替え, 1画面と2画面を切り替え]
  "Tools > ICM Calculator": [ICM計算機, ICMカリキュレーター]
  "Tools > Solver Job Execution Queue": [ジョブキュー, 実行キュー]
  "Tools > GTO Trainer > Trainer V3": [トレーナー, GTOトレーナー, トレーナーを開いて, 練習モード, トレーニング, V3, トレーナーV3, V3トレーナー, 新しいトレーナー]
  "Tools > GTO Trainer > Trainer V2 (2.0 - 3.5) discountinued": [V2, トレーナーV2, V2トレーナー, 古いトレーナー, 前の世代のトレーナー, 旧トレーナー]
  "Tools > GTO Trainer > Trainer V3: Play current spot from start": [このスポットを最初から練習, 最初からトレーニング]
  "Tools > GTO Trainer > Trainer V3: Play from current node": [このノードから練習, ここからトレーニング]
  "Tools > Generate Preflop Charts from current solution": [プリフロップチャートを作成, プリフロップチャート]
  "Tools > Refresh tree in the browser": [ツリーを更新, ツリーをリフレッシュ]
  "Tools > Load Script": [スクリプトを読み込んで]
  "Tree > Set strategy and lock node": [ノードロック, ノードロックして, ノードをロック, 戦略を設定してロック, ロックかけて, ロックして]
