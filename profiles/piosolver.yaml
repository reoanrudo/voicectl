# 画面のボタン・タブ・チェックボックスの日本語の言い方。キーは次のどれか：
#   "名前"            例: "Board"
#   "名前#AutomationId" 同じ名前が複数あるとき（例: "EV#radio0" はチェックボックスの EV）
#   "#AutomationId"    名前に記号が入るボタンなど（例: "#playSessionButton"）
# 名前と AutomationId は「このアプリを覚えて」で cache/appmaps/pioviewer3.exe.json の controls に記録される
control_aliases:
  # メイン画面
  "Board#boardButton": [ボード, ボードを入力, ボード設定, ボードを変えて]
  "Pick#pickButton": [ピック, ハンドを選んで]
  "Customize#customExpressionsButton": [フィルターのカスタマイズ]
  "Browser": [ブラウザタブ, ツリーブラウザ]
  "Postflop Tree Building and Calculations": [ツリー作成タブ, ツリー作成画面, ポストフロップのタブ]
  "Preflop": [プリフロップタブ, プリフロップ画面]
  "Tree information": [ツリー情報, ツリーの情報]
  "Equity#radio1": [エクイティ表示に切り替え, エクイティに切り替え]
