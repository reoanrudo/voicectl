# YouTube を見ているとき（ブラウザのウィンドウタイトルに YouTube が出ているとき）だけ有効になるプロファイル
# 動画プレイヤーのキーボードショートカットをそのまま音声の言い方に割り当てる
name: YouTube

match:
  title: [YouTube, ユーチューブ]   # 「〜 - YouTube - Brave」のようなタイトルで一致する

dictionary:
  シアターモード: シアター

vocabulary:
  - YouTube
  - シアターモード
  - チャプター
  - 再生リスト
  - 高評価

commands:
  再生と一時停止:
    say: [再生して, 一時停止, 止めて, 再開して, ポーズ, ポーズして]
    do:
      - keys: "k"
  早送り:
    say: [早送り, 進めて, 先に進んで, 送って]
    do:
      - keys: "l"
  巻き戻し:
    say: [巻き戻し, ちょっと戻して, 戻って, 後ろに戻して]
    do:
      - keys: "j"
  全画面:
    say: [全画面, フルスクリーン, 大きくして]
    do:
      - keys: "f"
  シアターモード:
    say: [シアターモード, シアター, 映画モード, 広げて]
    do:
      - keys: "t"
  字幕を切り替え:
    say: [字幕, 字幕つけて, 字幕消して, キャプション, 字幕を出して]
    do:
      - keys: "c"
  消音:
    say: [ミュート, 消音, 音を消して, 音消して]
    do:
      - keys: "m"
  次の動画:
    say: [次の動画, 次のやつ, 次に行って, これの次]
    do:
      - keys: "Shift+N"
  前の動画:
    say: [前の動画, 前のやつ, 一つ前に戻って]
    do:
      - keys: "Shift+P"
  再生速度を上げて:
    say: [再生速度を上げて, 速くして, 倍速にして, 早くして]
    do:
      - keys: "Shift+."
  再生速度を下げて:
    say: [再生速度を下げて, 遅くして, スローにして]
    do:
      - keys: "Shift+,"
  最初から再生:
    say: [最初から, 最初から再生して, 頭出しして]
    do:
      - keys: "0"
